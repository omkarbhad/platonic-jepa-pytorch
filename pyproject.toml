[project]
name = "platonic-jepa-pytorch"
version = "0.1.0"
description = "The Platonic Representation Theorem for JEPAs (Proving and Improving the PRH with JEPAs, 2026): spectral embeddings, the rotation bound, nuisance cost, with numerical checks on finite worlds."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platonic_jepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
